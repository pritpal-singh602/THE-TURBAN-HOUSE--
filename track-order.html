<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Track Order | THE TURBAN HOUSE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0b0b0b;
    color:#f5f0e6;
    min-height:100vh;
}

a{
    text-decoration:none;
    color:inherit;
}

header{
    background:#111;
    border-bottom:1px solid #c9a227;
}

.navbar{
    max-width:1200px;
    min-height:75px;
    margin:auto;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:#d4af37;
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
}

.back-link{
    color:#ccc;
    font-size:14px;
}

.page{
    max-width:850px;
    margin:50px auto 70px;
    padding:0 20px;
}

.heading{
    text-align:center;
    margin-bottom:30px;
}

.heading span{
    color:#d4af37;
    font-size:12px;
    letter-spacing:2px;
}

.heading h1{
    font-size:36px;
    margin:10px 0;
}

.heading p{
    color:#888;
    font-size:14px;
}

.search-box{
    background:#121212;
    border:1px solid #292929;
    border-radius:16px;
    padding:20px;
    display:flex;
    gap:10px;
}

.search-box input{
    flex:1;
    background:#0b0b0b;
    border:1px solid #444;
    border-radius:9px;
    padding:14px;
    color:#fff;
    outline:none;
    font-size:14px;
}

.search-box input:focus{
    border-color:#d4af37;
}

.search-box button{
    background:#d4af37;
    color:#111;
    border:none;
    border-radius:9px;
    padding:0 25px;
    font-weight:800;
    cursor:pointer;
}

.result{
    margin-top:25px;
}

.order-card{
    background:#121212;
    border:1px solid #292929;
    border-radius:18px;
    padding:25px;
}

.order-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding-bottom:20px;
    border-bottom:1px solid #292929;
}

.order-id-label{
    color:#888;
    font-size:11px;
}

.order-id{
    color:#d4af37;
    font-size:20px;
    font-weight:bold;
    margin-top:5px;
}

.status-badge{
    padding:8px 15px;
    border-radius:30px;
    background:#28200a;
    border:1px solid #8b7425;
    color:#e1c44e;
    font-size:12px;
    font-weight:bold;
}

.progress{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    margin:35px 0 25px;
    position:relative;
}

.progress-line{
    position:absolute;
    left:10%;
    right:10%;
    top:17px;
    height:3px;
    background:#333;
    z-index:0;
}

.progress-fill{
    position:absolute;
    left:10%;
    top:17px;
    height:3px;
    background:#d4af37;
    z-index:1;
    width:0;
    transition:.4s;
}

.step{
    position:relative;
    z-index:2;
    text-align:center;
}

.circle{
    width:35px;
    height:35px;
    margin:auto;
    border-radius:50%;
    border:2px solid #444;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    font-size:12px;
    font-weight:bold;
}

.step.active .circle,
.step.completed .circle{
    background:#d4af37;
    border-color:#d4af37;
    color:#111;
}

.step-name{
    margin-top:9px;
    color:#777;
    font-size:10px;
}

.step.active .step-name,
.step.completed .step-name{
    color:#d4af37;
}

.order-details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:25px;
}

.detail{
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:11px;
    padding:15px;
}

.detail h3{
    color:#d4af37;
    font-size:12px;
    margin-bottom:8px;
}

.detail p{
    color:#aaa;
    font-size:12px;
    line-height:1.6;
}

.items{
    margin-top:18px;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:11px;
    padding:15px;
}

.items h3{
    color:#d4af37;
    font-size:13px;
    margin-bottom:12px;
}

.item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:10px 0;
    border-bottom:1px solid #242424;
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-size:12px;
}

.item-qty{
    color:#777;
    font-size:10px;
    margin-top:4px;
}

.item-price{
    color:#d4af37;
    font-size:12px;
    font-weight:bold;
}

.total{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    padding:15px;
    background:#18140a;
    border:1px solid #594b20;
    border-radius:10px;
}

.total span{
    color:#bbb;
}

.total strong{
    color:#d4af37;
    font-size:19px;
}

.not-found{
    background:#121212;
    border:1px solid #5a2525;
    border-radius:16px;
    padding:35px;
    text-align:center;
}

.not-found h2{
    margin-bottom:10px;
}

.not-found p{
    color:#888;
    font-size:13px;
}

.home-actions{
    margin-top:25px;
    display:flex;
    justify-content:center;
    gap:12px;
}

.home-actions a{
    padding:12px 20px;
    border-radius:9px;
    font-size:13px;
    font-weight:bold;
}

.shop{
    background:#d4af37;
    color:#111;
}

.home{
    border:1px solid #444;
    color:#ddd;
}

footer{
    border-top:1px solid #292929;
    padding:30px 20px;
    text-align:center;
    color:#777;
    font-size:12px;
}

@media(max-width:650px){

    .navbar{
        min-height:65px;
    }

    .logo{
        font-size:16px;
    }

    .page{
        margin-top:30px;
    }

    .heading h1{
        font-size:29px;
    }

    .search-box{
        flex-direction:column;
    }

    .search-box button{
        padding:14px;
    }

    .order-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .progress{
        grid-template-columns:repeat(5,1fr);
    }

    .step-name{
        font-size:8px;
    }

    .circle{
        width:29px;
        height:29px;
    }

    .progress-line,
    .progress-fill{
        top:14px;
    }

    .order-details{
        grid-template-columns:1fr;
    }

    .home-actions{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>

    <div class="navbar">

        <a href="index.html" class="logo">
            THE TURBAN HOUSE
        </a>

        <a href="shop.html" class="back-link">
            Continue Shopping
        </a>

    </div>

</header>


<main class="page">

    <section class="heading">

        <span>ORDER TRACKING</span>

        <h1>Track Your Order</h1>

        <p>
            Enter your Order ID to check your latest order status.
        </p>

    </section>


    <section class="search-box">

        <input
            type="text"
            id="orderIdInput"
            placeholder="Example: TH-260926-1234"
            autocomplete="off"
        >

        <button onclick="trackOrder()">
            TRACK ORDER
        </button>

    </section>


    <section class="result" id="result"></section>

</main>


<footer>
    © 2026 THE TURBAN HOUSE • Premium Punjabi Men's Collection
</footer>


<script src="/api-sync.js"></script>
<script>

let orders =
    JSON.parse(
        localStorage.getItem("TH_ORDERS") || "[]"
    );


function money(value){

    return "₹" +
        Number(value || 0).toLocaleString("en-IN");

}


function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getStatusIndex(status){

    const statuses = [
        "Pending",
        "Confirmed",
        "Packed",
        "Shipped",
        "Delivered"
    ];

    return statuses.indexOf(status);

}


function renderOrder(order){

    const status =
        order.status || "Pending";

    const statusIndex =
        getStatusIndex(status);


    const cancelled =
        status.toLowerCase() === "cancelled";


    let progressHTML = "";


    if(cancelled){

        progressHTML = `

            <div style="
                text-align:center;
                padding:25px;
                color:#d66;
                background:#1a0e0e;
                border:1px solid #542323;
                border-radius:10px;
                margin:25px 0;
            ">

                <strong>
                    Order Cancelled
                </strong>

                <div style="
                    margin-top:7px;
                    color:#888;
                    font-size:12px;
                ">
                    This order is no longer being processed.
                </div>

            </div>

        `;

    }else{

        const statuses = [
            "Pending",
            "Confirmed",
            "Packed",
            "Shipped",
            "Delivered"
        ];


        progressHTML = `

            <div class="progress">

                <div class="progress-line"></div>

                <div
                    class="progress-fill"
                    style="
                        width:${Math.max(
                            0,
                            Math.min(
                                80,
                                statusIndex * 20
                            )
                        )}%;
                    "
                ></div>

                ${statuses.map((item,index)=>`

                    <div class="
                        step
                        ${
                            index < statusIndex
                            ? "completed"
                            : ""
                        }
                        ${
                            index === statusIndex
                            ? "active"
                            : ""
                        }
                    ">

                        <div class="circle">
                            ${
                                index < statusIndex
                                ? "✓"
                                : index + 1
                            }
                        </div>

                        <div class="step-name">
                            ${item}
                        </div>

                    </div>

                `).join("")}

            </div>

        `;

    }


    const products =
        order.products || [];


    const itemsHTML =
        products.map(product=>`

            <div class="item">

                <div>

                    <div class="item-name">
                        ${escapeHtml(product.name)}
                    </div>

                    <div class="item-qty">
                        Qty: ${Number(product.quantity || 1)}
                    </div>

                </div>

                <div class="item-price">
                    ${money(product.total)}
                </div>

            </div>

        `).join("");


    const customer =
        order.customer || {};


    document.getElementById("result").innerHTML = `

        <div class="order-card">

            <div class="order-header">

                <div>

                    <div class="order-id-label">
                        ORDER ID
                    </div>

                    <div class="order-id">
                        ${escapeHtml(order.id)}
                    </div>

                </div>

                <div class="status-badge">
                    ${escapeHtml(status)}
                </div>

            </div>


            ${progressHTML}


            <div class="order-details">

                <div class="detail">

                    <h3>
                        CUSTOMER
                    </h3>

                    <p>
                        ${escapeHtml(customer.name)}
                        <br>
                        ${escapeHtml(customer.mobile)}
                    </p>

                </div>


                <div class="detail">

                    <h3>
                        DELIVERY ADDRESS
                    </h3>

                    <p>
                        ${escapeHtml(customer.address)}
                        <br>
                        ${escapeHtml(customer.city)},
                        ${escapeHtml(customer.state)}
                        <br>
                        ${escapeHtml(customer.pincode)}
                    </p>

                </div>


                <div class="detail">

                    <h3>
                        PAYMENT
                    </h3>

                    <p>
                        ${escapeHtml(order.paymentMode)}
                    </p>

                </div>


                <div class="detail">

                    <h3>
                        ORDER DATE
                    </h3>

                    <p>
                        ${order.createdAt
                            ? new Date(
                                order.createdAt
                              ).toLocaleString("en-IN")
                            : "N/A"
                        }
                    </p>

                </div>

            </div>


            <div class="items">

                <h3>
                    ORDER ITEMS
                </h3>

                ${itemsHTML}

            </div>


            <div class="total">

                <span>
                    Grand Total
                </span>

                <strong>
                    ${money(order.total)}
                </strong>

            </div>

        </div>

    `;

}


function trackOrder(){

    const input =
        document.getElementById("orderIdInput")
        .value.trim();


    if(!input){

        alert("Please enter your Order ID.");
        return;

    }


    const order =
        orders.find(
            item =>
                String(item.id).toLowerCase() ===
                input.toLowerCase()
        );


    if(!order){

        document.getElementById("result").innerHTML = `

            <div class="not-found">

                <h2>
                    Order Not Found
                </h2>

                <p>
                    Please check your Order ID and try again.
                </p>

                <div class="home-actions">

                    <a href="shop.html" class="shop">
                        SHOP NOW
                    </a>

                    <a href="index.html" class="home">
                        HOME
                    </a>

                </div>

            </div>

        `;

        return;

    }


    renderOrder(order);

}


/*
  If an order was just created,
  automatically show it.
*/

const latestOrder =
    JSON.parse(
        localStorage.getItem("TH_LAST_ORDER") || "null"
    );


if(latestOrder){

    document.getElementById("orderIdInput").value =
        latestOrder.id;

    renderOrder(latestOrder);

}


/*
  Press Enter to track.
*/

document.getElementById("orderIdInput")
.addEventListener("keydown",function(event){

    if(event.key === "Enter"){

        trackOrder();

    }

});

</script>

</body>
</html>
