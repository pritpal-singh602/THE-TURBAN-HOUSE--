<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reviews | THE TURBAN HOUSE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f7f3ea;
    color:#17130d;
}

/* HEADER */
.header{
    background:#111;
    color:#fff;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#d5aa45;
}

.header-right{
    display:flex;
    gap:10px;
}

.header-btn{
    color:#fff;
    text-decoration:none;
    border:1px solid #d5aa45;
    padding:9px 14px;
    border-radius:8px;
    font-size:13px;
}

/* CONTAINER */
.container{
    max-width:1400px;
    margin:auto;
    padding:35px 5%;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    font-size:32px;
}

.page-title p{
    color:#777;
    margin-top:7px;
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stat{
    background:#fff;
    padding:22px;
    border-radius:14px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.stat-title{
    color:#777;
    font-size:13px;
}

.stat-number{
    font-size:28px;
    font-weight:900;
    margin-top:8px;
}

.gold{
    color:#b48722;
}

.orange{
    color:#c27a00;
}

.green{
    color:#218c45;
}

.red{
    color:#c0392b;
}

/* FILTER */
.filter-box{
    background:#fff;
    padding:20px;
    border-radius:14px;
    margin-bottom:22px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.filter-box input,
.filter-box select{
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    background:#fff;
}

.search{
    flex:1;
    min-width:220px;
}

/* REVIEWS */
.review-list{
    display:grid;
    gap:18px;
}

.review-card{
    background:#fff;
    padding:22px;
    border-radius:14px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.review-header{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
}

.customer{
    font-size:17px;
    font-weight:900;
}

.email{
    color:#888;
    font-size:12px;
    margin-top:4px;
}

.date{
    color:#999;
    font-size:12px;
}

.product-name{
    margin-top:14px;
    font-weight:800;
    color:#72520d;
}

.rating{
    color:#d5aa45;
    font-size:20px;
    letter-spacing:2px;
    margin:10px 0;
}

.review-title{
    font-size:17px;
    font-weight:900;
    margin-bottom:7px;
}

.review-text{
    color:#555;
    line-height:1.7;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:900;
    margin-top:14px;
}

.status.pending{
    background:#fff1d6;
    color:#a56800;
}

.status.approved{
    background:#dff5e7;
    color:#218c45;
}

.status.rejected{
    background:#fde3e3;
    color:#c0392b;
}

/* ACTIONS */
.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:18px;
    border-top:1px solid #eee;
    padding-top:16px;
}

.action{
    border:0;
    padding:10px 14px;
    border-radius:7px;
    cursor:pointer;
    font-weight:800;
}

.approve{
    background:#218c45;
    color:#fff;
}

.reject{
    background:#c27a00;
    color:#fff;
}

.delete{
    background:#c0392b;
    color:#fff;
}

.action:hover{
    opacity:.85;
}

.empty{
    background:#fff;
    padding:50px;
    text-align:center;
    border-radius:14px;
    color:#888;
}

/* MOBILE */
@media(max-width:900px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .header{
        padding:15px;
    }

    .logo{
        font-size:16px;
    }

    .header-btn{
        padding:8px 10px;
        font-size:11px;
    }

    .container{
        padding:25px 15px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat{
        padding:16px;
    }

    .stat-number{
        font-size:23px;
    }

    .review-header{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        THE <span>TURBAN</span> HOUSE
    </div>

    <div class="header-right">

        <a href="admin.html" class="header-btn">
            Dashboard
        </a>

        <a href="shop.html" class="header-btn">
            Shop
        </a>

    </div>

</header>


<main class="container">

    <div class="page-title">

        <h1>
            ⭐ Customer Reviews
        </h1>

        <p>
            Manage customer product reviews and ratings.
        </p>

    </div>


    <!-- STATS -->

    <section class="stats">

        <div class="stat">

            <div class="stat-title">
                Total Reviews
            </div>

            <div
                class="stat-number gold"
                id="totalReviews">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Pending
            </div>

            <div
                class="stat-number orange"
                id="pendingReviews">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Approved
            </div>

            <div
                class="stat-number green"
                id="approvedReviews">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Rejected
            </div>

            <div
                class="stat-number red"
                id="rejectedReviews">
                0
            </div>

        </div>

    </section>


    <!-- FILTER -->

    <section class="filter-box">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search customer, product or review..."
            oninput="renderReviews()">


        <select
            id="statusFilter"
            onchange="renderReviews()">

            <option value="all">
                All Status
            </option>

            <option value="Pending">
                Pending
            </option>

            <option value="Approved">
                Approved
            </option>

            <option value="Rejected">
                Rejected
            </option>

        </select>


        <select
            id="ratingFilter"
            onchange="renderReviews()">

            <option value="all">
                All Ratings
            </option>

            <option value="5">
                ⭐ 5 Stars
            </option>

            <option value="4">
                ⭐ 4 Stars
            </option>

            <option value="3">
                ⭐ 3 Stars
            </option>

            <option value="2">
                ⭐ 2 Stars
            </option>

            <option value="1">
                ⭐ 1 Star
            </option>

        </select>

    </section>


    <!-- REVIEW LIST -->

    <section
        class="review-list"
        id="reviewList">

        <div class="empty">
            Loading reviews...
        </div>

    </section>

</main>


<script src="/api-sync.js"></script>
<script>

/* =========================
   LOAD REVIEWS
========================= */

let reviews =
    JSON.parse(
        localStorage.getItem("TH_REVIEWS") || "[]"
    );


/* =========================
   STATS
========================= */

function updateStats(){

    const total =
        reviews.length;


    const pending =
        reviews.filter(
            r =>
            String(r.status).toLowerCase()
            === "pending"
        ).length;


    const approved =
        reviews.filter(
            r =>
            String(r.status).toLowerCase()
            === "approved"
        ).length;


    const rejected =
        reviews.filter(
            r =>
            String(r.status).toLowerCase()
            === "rejected"
        ).length;


    document.getElementById("totalReviews")
        .innerText = total;


    document.getElementById("pendingReviews")
        .innerText = pending;


    document.getElementById("approvedReviews")
        .innerText = approved;


    document.getElementById("rejectedReviews")
        .innerText = rejected;

}


/* =========================
   STARS
========================= */

function getStars(rating){

    const value =
        Number(rating) || 0;

    let result = "";

    for(let i = 1; i <= 5; i++){

        result +=
            i <= value ? "★" : "☆";

    }

    return result;

}


/* =========================
   STATUS CLASS
========================= */

function statusClass(status){

    const value =
        String(status || "Pending")
        .toLowerCase();

    return value;

}


/* =========================
   RENDER
========================= */

function renderReviews(){

    updateStats();


    const list =
        document.getElementById("reviewList");


    const search =
        document.getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const statusFilter =
        document.getElementById("statusFilter")
        .value;


    const ratingFilter =
        document.getElementById("ratingFilter")
        .value;


    let filtered =
        reviews.filter(review => {


            const searchable =
                (
                    review.customerName || ""
                ).toLowerCase()
                + " "
                +
                (
                    review.customerEmail || ""
                ).toLowerCase()
                + " "
                +
                (
                    review.productName || ""
                ).toLowerCase()
                + " "
                +
                (
                    review.title || ""
                ).toLowerCase()
                + " "
                +
                (
                    review.text || ""
                ).toLowerCase();


            const matchesSearch =
                !search ||
                searchable.includes(search);


            const matchesStatus =
                statusFilter === "all"
                ||
                String(review.status)
                === statusFilter;


            const matchesRating =
                ratingFilter === "all"
                ||
                Number(review.rating)
                === Number(ratingFilter);


            return (
                matchesSearch &&
                matchesStatus &&
                matchesRating
            );

        });


    if(!filtered.length){

        list.innerHTML = `

            <div class="empty">

                No reviews found.

            </div>

        `;

        return;

    }


    list.innerHTML =
        filtered.map(review => {


            const date =
                review.createdAt
                ?
                new Date(review.createdAt)
                    .toLocaleString("en-IN")
                :
                "—";


            const status =
                review.status || "Pending";


            return `

                <article class="review-card">

                    <div class="review-header">

                        <div>

                            <div class="customer">

                                ${escapeHtml(
                                    review.customerName
                                    || "Customer"
                                )}

                            </div>

                            <div class="email">

                                ${escapeHtml(
                                    review.customerEmail
                                    || ""
                                )}

                            </div>

                        </div>


                        <div class="date">

                            ${escapeHtml(date)}

                        </div>

                    </div>


                    <div class="product-name">

                        Product:
                        ${escapeHtml(
                            review.productName
                            || "Unknown Product"
                        )}

                    </div>


                    <div class="rating">

                        ${getStars(review.rating)}

                    </div>


                    ${
                        review.title
                        ?
                        `
                        <div class="review-title">

                            ${escapeHtml(
                                review.title
                            )}

                        </div>
                        `
                        :
                        ""
                    }


                    <div class="review-text">

                        ${escapeHtml(
                            review.text
                            || ""
                        )}

                    </div>


                    <span
                        class="status ${statusClass(status)}">

                        ${escapeHtml(status)}

                    </span>


                    <div class="actions">

                        ${
                            status !== "Approved"
                            ?
                            `
                            <button
                                class="action approve"
                                onclick="approveReview('${review.id}')">

                                ✓ Approve

                            </button>
                            `
                            :
                            ""
                        }


                        ${
                            status !== "Rejected"
                            ?
                            `
                            <button
                                class="action reject"
                                onclick="rejectReview('${review.id}')">

                                ✕ Reject

                            </button>
                            `
                            :
                            ""
                        }


                        <button
                            class="action delete"
                            onclick="deleteReview('${review.id}')">

                            🗑 Delete

                        </button>

                    </div>

                </article>

            `;

        }).join("");

}


/* =========================
   APPROVE
========================= */

function approveReview(id){

    const review =
        reviews.find(
            item => item.id === id
        );


    if(!review) return;


    review.status =
        "Approved";


    localStorage.setItem(
        "TH_REVIEWS",
        JSON.stringify(reviews)
    );


    renderReviews();


    alert(
        "Review approved successfully."
    );

}


/* =========================
   REJECT
========================= */

function rejectReview(id){

    const review =
        reviews.find(
            item => item.id === id
        );


    if(!review) return;


    review.status =
        "Rejected";


    localStorage.setItem(
        "TH_REVIEWS",
        JSON.stringify(reviews)
    );


    renderReviews();


    alert(
        "Review rejected."
    );

}


/* =========================
   DELETE
========================= */

function deleteReview(id){

    const review =
        reviews.find(
            item => item.id === id
        );


    if(!review) return;


    const confirmed =
        confirm(
            "Are you sure you want to delete this review?"
        );


    if(!confirmed) return;


    reviews =
        reviews.filter(
            item => item.id !== id
        );


    localStorage.setItem(
        "TH_REVIEWS",
        JSON.stringify(reviews)
    );


    renderReviews();


    alert(
        "Review deleted successfully."
    );

}


/* =========================
   SECURITY
========================= */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* START */

renderReviews();

</script>

</body>
</html>
