<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Confirmed | THE TURBAN HOUSE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0b0b0b;
    color:#f5f0e6;
    min-height:100vh;
}

a{
    text-decoration:none;
    color:inherit;
}

header{
    background:#111;
    border-bottom:1px solid #c9a227;
}

.navbar{
    max-width:1200px;
    margin:auto;
    min-height:75px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:#d4af37;
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
}

.navbar a:last-child{
    color:#ddd;
    font-size:14px;
}

.success-wrapper{
    max-width:850px;
    margin:55px auto;
    padding:0 20px;
}

.success-card{
    background:#121212;
    border:1px solid #333;
    border-radius:20px;
    padding:35px;
    text-align:center;
}

.success-icon{
    width:78px;
    height:78px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#d4af37;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:bold;
}

.success-card .small-title{
    color:#d4af37;
    font-size:12px;
    letter-spacing:2px;
}

.success-card h1{
    font-size:34px;
    margin:10px 0;
}

.success-card .message{
    color:#aaa;
    line-height:1.6;
    font-size:14px;
}

.order-id-box{
    margin:25px 0;
    background:#0c0c0c;
    border:1px solid #594b20;
    border-radius:12px;
    padding:18px;
}

.order-id-label{
    color:#888;
    font-size:11px;
    letter-spacing:1px;
}

.order-id{
    color:#d4af37;
    font-size:23px;
    font-weight:bold;
    margin-top:6px;
}

.details{
    margin-top:25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    text-align:left;
}

.detail-box{
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:12px;
    padding:17px;
}

.detail-box h3{
    color:#d4af37;
    font-size:13px;
    margin-bottom:12px;
}

.detail-box p{
    color:#bbb;
    font-size:13px;
    line-height:1.7;
}

.products{
    margin-top:20px;
    text-align:left;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:12px;
    padding:18px;
}

.products h3{
    color:#d4af37;
    font-size:14px;
    margin-bottom:15px;
}

.product-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:12px 0;
    border-bottom:1px solid #252525;
}

.product-row:last-child{
    border-bottom:none;
}

.product-name{
    font-size:13px;
}

.product-qty{
    color:#777;
    font-size:11px;
    margin-top:4px;
}

.product-price{
    color:#d4af37;
    font-weight:bold;
    white-space:nowrap;
}

.total-box{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-radius:12px;
    background:#18140a;
    border:1px solid #594b20;
}

.total-box span{
    color:#bbb;
}

.total-box strong{
    color:#d4af37;
    font-size:23px;
}

.status{
    display:inline-block;
    margin-top:20px;
    padding:8px 16px;
    border-radius:30px;
    background:#28200a;
    border:1px solid #8b7425;
    color:#e1c44e;
    font-size:12px;
    font-weight:bold;
}

.actions{
    display:flex;
    gap:12px;
    margin-top:28px;
}

.action-btn{
    flex:1;
    padding:14px;
    border-radius:10px;
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

.shop-btn{
    background:#d4af37;
    color:#111;
}

.whatsapp-btn{
    background:#176b39;
    color:#fff;
}

.home-btn{
    border:1px solid #444;
    color:#ddd;
    margin-top:12px;
    display:block;
    padding:13px;
    border-radius:10px;
    text-align:center;
    font-size:13px;
}

.note{
    margin-top:20px;
    color:#777;
    font-size:11px;
    line-height:1.6;
}

.error-box{
    text-align:center;
    padding:70px 20px;
}

.error-box h2{
    margin-bottom:12px;
}

.error-box p{
    color:#888;
    margin-bottom:25px;
}

footer{
    border-top:1px solid #292929;
    margin-top:50px;
    padding:28px 20px;
    text-align:center;
    color:#777;
    font-size:12px;
}

@media(max-width:650px){

    .navbar{
        min-height:65px;
    }

    .logo{
        font-size:16px;
    }

    .success-wrapper{
        margin:30px auto;
    }

    .success-card{
        padding:22px 15px;
    }

    .success-card h1{
        font-size:27px;
    }

    .details{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column;
    }

    .total-box{
        padding:15px;
    }
}
</style>
</head>

<body>

<header>

    <div class="navbar">

        <a href="index.html" class="logo">
            THE TURBAN HOUSE
        </a>

        <a href="shop.html">
            Continue Shopping
        </a>

    </div>

</header>


<main class="success-wrapper">

    <section id="successContent"></section>

</main>


<footer>
    © 2026 THE TURBAN HOUSE • Premium Punjabi Men's Collection
</footer>


<script src="/api-sync.js"></script>
<script>

const order =
    JSON.parse(
        localStorage.getItem("TH_LAST_ORDER") || "null"
    );


function money(value){

    return "₹" +
        Number(value || 0).toLocaleString("en-IN");

}


function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function showError(){

    document.getElementById("successContent").innerHTML = `

        <div class="success-card error-box">

            <h2>No Recent Order Found</h2>

            <p>
                We could not find a recently placed order.
            </p>

            <a href="shop.html" class="shop-btn action-btn">
                SHOP NOW
            </a>

        </div>

    `;

}


function whatsappOrder(){

    if(!order){
        return;
    }

    /*
      WhatsApp Business number will be connected
      from the backend/settings stage.
    */

    const phone = "91XXXXXXXXXX";


    let message =
        "Hello THE TURBAN HOUSE,%0A%0A" +

        "I have placed an order.%0A%0A" +

        "Order ID: " +
        encodeURIComponent(order.id) +
        "%0A" +

        "Customer: " +
        encodeURIComponent(order.customer.name) +
        "%0A" +

        "Mobile: " +
        encodeURIComponent(order.customer.mobile) +
        "%0A" +

        "Total: " +
        encodeURIComponent(money(order.total)) +
        "%0A" +

        "Payment: " +
        encodeURIComponent(order.paymentMode) +
        "%0A%0A" +

        "Products:%0A";


    order.products.forEach(product=>{

        message +=
            "- " +
            encodeURIComponent(product.name) +
            " x " +
            product.quantity +
            " = " +
            encodeURIComponent(money(product.total)) +
            "%0A";

    });


    message +=
        "%0AThank you.";


    window.open(
        "https://wa.me/" + phone + "?text=" + message,
        "_blank"
    );

}


function renderOrder(){

    if(!order){

        showError();
        return;

    }


    const customer =
        order.customer || {};

    const products =
        order.products || [];


    const productHTML =
        products.map(product=>`

            <div class="product-row">

                <div>

                    <div class="product-name">
                        ${escapeHtml(product.name)}
                    </div>

                    <div class="product-qty">
                        Qty: ${Number(product.quantity || 1)}
                    </div>

                </div>

                <div class="product-price">
                    ${money(product.total)}
                </div>

            </div>

        `).join("");


    document.getElementById("successContent").innerHTML = `

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>

            <div class="small-title">
                ORDER RECEIVED
            </div>

            <h1>
                Thank You!
            </h1>

            <p class="message">
                Your order has been successfully created.
                Please keep your Order ID for future tracking.
            </p>


            <div class="order-id-box">

                <div class="order-id-label">
                    YOUR ORDER ID
                </div>

                <div class="order-id">
                    ${escapeHtml(order.id)}
                </div>

            </div>


            <div class="details">

                <div class="detail-box">

                    <h3>
                        CUSTOMER
                    </h3>

                    <p>
                        <strong>
                            ${escapeHtml(customer.name)}
                        </strong>
                        <br>
                        ${escapeHtml(customer.mobile)}
                    </p>

                </div>


                <div class="detail-box">

                    <h3>
                        DELIVERY ADDRESS
                    </h3>

                    <p>
                        ${escapeHtml(customer.address)}
                        <br>
                        ${escapeHtml(customer.city)},
                        ${escapeHtml(customer.state)}
                        <br>
                        ${escapeHtml(customer.pincode)}
                    </p>

                </div>


                <div class="detail-box">

                    <h3>
                        PAYMENT
                    </h3>

                    <p>
                        ${escapeHtml(order.paymentMode)}
                    </p>

                </div>


                <div class="detail-box">

                    <h3>
                        ORDER STATUS
                    </h3>

                    <p>
                        Your order is currently being processed.
                    </p>

                </div>

            </div>


            <div class="products">

                <h3>
                    ORDER ITEMS
                </h3>

                ${productHTML}

            </div>


            <div class="total-box">

                <span>
                    Grand Total
                </span>

                <strong>
                    ${money(order.total)}
                </strong>

            </div>


            <div class="status">
                ● ${escapeHtml(order.status || "Pending")}
            </div>


            <div class="actions">

                <a
                    href="shop.html"
                    class="action-btn shop-btn"
                >
                    CONTINUE SHOPPING
                </a>


                <button
                    onclick="whatsappOrder()"
                    class="action-btn whatsapp-btn"
                    style="border:none;cursor:pointer;"
                >
                    CONFIRM ON WHATSAPP
                </button>

            </div>


            <a href="index.html" class="home-btn">
                ← Back to Home
            </a>


            <div class="note">

                Order tracking and automatic WhatsApp
                notifications will be connected with the
                permanent backend/database in the next stage.

            </div>

        </div>

    `;

}


renderOrder();

</script>

</body>
</html>
